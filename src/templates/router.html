<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>State of Efficiency</title>
  <meta name="description" content="State of Efficiency. Der effiziente Staat. / The efficient state.">
  <link rel="canonical" href="__BASE__">
  <link rel="alternate" hreflang="de" href="__BASE__de/">
  <link rel="alternate" hreflang="en" href="__BASE__en/">
  <link rel="alternate" hreflang="x-default" href="__BASE__">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;font:500 16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#000;background:#fff}
    a{color:inherit}
    p{text-align:center;margin:.4rem 0}
  </style>
  <script>
    (function () {
      var hosts = __HOSTS__;
      var langs = __LANGS__;
      var fallback = __DEFAULT__;
      function pick() {
        var host = location.hostname.toLowerCase();
        for (var suffix in hosts) {
          if (host.slice(-suffix.length) === suffix) return hosts[suffix];
        }
        try {
          var saved = localStorage.getItem('soe-lang');
          if (saved && langs.indexOf(saved) > -1) return saved;
        } catch (e) {}
        var prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
        for (var i = 0; i < prefs.length; i++) {
          var code = String(prefs[i] || '').slice(0, 2).toLowerCase();
          if (langs.indexOf(code) > -1) return code;
        }
        return fallback;
      }
      location.replace('./' + pick() + '/' + location.search + location.hash);
    })();
  </script>
</head>
<body>
  <noscript>
    <p><a href="de/">Deutsch</a> · <a href="en/">English</a></p>
  </noscript>
</body>
</html>
