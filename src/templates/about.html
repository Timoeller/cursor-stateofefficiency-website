    <section class="page-hero" aria-labelledby="about-title">
      <div class="container">
        <p class="eyebrow">{{t.about.eyebrow}}</p>
        <h1 id="about-title" class="h1">{{t.about.title}}</h1>
        <p class="lead lead--wide">{{t.about.text}}</p>
      </div>
    </section>

    <section class="section section--tight" aria-label="{{t.about.eyebrow}}">
      <div class="container people">
        {{#each t.about.people}}<article class="person reveal" id="{{key}}">
          <div class="person-side">
            <img class="avatar" src="{{assets}}img/{{photo}}" alt="{{alt}}" width="320" height="320" loading="lazy">
          </div>
          <div class="person-body">
            <h2 class="h2">{{name}}</h2>
            <p class="kicker">{{tagline}}</p>
            <p class="muted person-summary">{{summary}}</p>
            <a class="btn btn--ghost btn--sm" href="{{linkedinUrl}}" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45zM22.23 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.46c.98 0 1.77-.77 1.77-1.73V1.73C24 .77 23.21 0 22.23 0z"/></svg>{{t.about.linkedin}}<span class="sr-only"> ({{name}})</span></a>
          </div>
        </article>
        {{/each}}
      </div>
    </section>

{{> cta}}
