<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{seo.title}}</title>
  <meta name="description" content="{{seo.description}}">
  <link rel="canonical" href="{{canonical}}">
  {{#each alternates}}<link rel="alternate" hreflang="{{hreflang}}" href="{{href}}">
  {{/each}}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{site.name}}">
  <meta property="og:title" content="{{seo.title}}">
  <meta property="og:description" content="{{seo.description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:locale" content="{{meta.ogLocale}}">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="{{root}}assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="{{root}}assets/fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{root}}assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{root}}assets/styles.css">
  <script>document.documentElement.classList.add('js')</script>
</head>
<body data-page="{{page}}" data-lang="{{lang}}">
  <a class="skip" href="#main">{{a11y.skip}}</a>
  {{> header}}
  <main id="main">
{{{content}}}
  </main>
  {{> footer}}
  <script src="{{root}}assets/main.js" defer></script>
</body>
</html>
